name: Web interface checks
on:
  push:
    paths: ['web/**', '.github/workflows/web-checks.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-checks.yml']
permissions:
  contents: read
jobs:
  browser-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node --check web/app.mjs
      - run: node --test web/*.test.mjs
